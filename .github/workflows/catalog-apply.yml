# Applies review commands / intake / a sync in the shared catalog-writer FIFO queue
# (spec §6.2). Inputs are IDs only; the comment and issue are re-fetched by ID and
# the author's permission is re-checked before anything is written.
name: Catalog apply

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [command, intake, sync]
        required: true
      issue_number:
        type: string
        default: "0"
      comment_id:
        type: string
        default: "0"

concurrency:
  group: catalog-writer
  queue: max

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    # Tokens go only to the steps that call gh/git (Load, Push, Reply, Sync), never at job
    # level, and the checkout persists none in .git/config. Caches are restore-only, so
    # nothing this job runs is saved for catalog-run. Same-job isolation is still partial:
    # Install/Apply code could tamper with later steps via $GITHUB_PATH or the venv. Splitting
    # untrusted apply from the writer into two jobs is a tracked follow-up.
    env:
      GH_REPO: ${{ github.repository }}
      KIND: ${{ inputs.kind }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      COMMENT_ID: ${{ inputs.comment_id }}
    steps:
      - name: Validate inputs (IDs only; never interpolated into shell)
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::issue_number must be numeric"; exit 1; }
          [[ "$COMMENT_ID" =~ ^[0-9]+$ ]] || { echo "::error::comment_id must be numeric"; exit 1; }
          if [ "$KIND" = command ] && [ "$COMMENT_ID" = 0 ]; then echo "::error::kind=command needs a comment_id"; exit 1; fi

      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - id: py
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v6
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('constraints-ci.txt', 'pyproject.toml') }}

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('constraints-ci.txt') }}

      - name: Install (rebuild the venv if missing or broken)
        id: install
        run: |
          if [ -x ~/venv/bin/python ] && ~/venv/bin/python -c "import ndif_citations, torch, surya, openpyxl" 2>/dev/null; then
            ~/venv/bin/pip install -q -e . --no-deps
          else
            rm -rf ~/venv
            python -m venv ~/venv
            ~/venv/bin/pip install -q torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
            ~/venv/bin/pip install -q -e . -c constraints-ci.txt
          fi
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Load the issue + comment by ID and re-check permission
        id: load
        if: ${{ inputs.kind != 'sync' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          if [ "$COMMENT_ID" != 0 ]; then
            gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID" > "$RUNNER_TEMP/comment.json"
            # The comment must belong to this issue, so an old command can't be replayed elsewhere.
            issue_url=$(jq -r .issue_url "$RUNNER_TEMP/comment.json")
            [[ "$issue_url" == */issues/"$ISSUE_NUMBER" ]] || { echo "::error::comment is not on issue #$ISSUE_NUMBER"; exit 1; }
            login=$(jq -r .user.login "$RUNNER_TEMP/comment.json")
          else
            echo '{}' > "$RUNNER_TEMP/comment.json"
            login=$(jq -r .user.login "$RUNNER_TEMP/issue.json")
          fi
          perm=$(gh api "repos/$GH_REPO/collaborators/$login/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|write) ;; *) echo "::error::$login lacks write permission"; exit 1 ;; esac

      - name: Apply
        id: apply
        if: ${{ inputs.kind != 'sync' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EXTRA_BODY: ${{ vars.LLM_EXTRA_BODY }}
          AUTO_PUBLISH_RULES: ${{ vars.AUTO_PUBLISH_RULES }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
        run: >
          python -m ndif_citations review-apply --kind "$KIND"
          --issue-json "$RUNNER_TEMP/issue.json" --comment-json "$RUNNER_TEMP/comment.json"
          --out "$RUNNER_TEMP/result.json"

      - name: Push catalog
        id: push
        if: ${{ steps.apply.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout persisted no credentials; push_catalog's git subprocesses inherit
          # this env-only auth header (catalog_git._git copies os.environ).
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                 GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m ndif_citations push-catalog --push-conflict-branch -m "data: review #$ISSUE_NUMBER"

      # Reply + close BEFORE the sync: a closed issue is out of review-sync's open list,
      # so no "Resolved"/"can't find" noise follows the reply.
      - name: Reply and close
        if: ${{ inputs.kind != 'sync' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r .reply "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/reply.md"
          if [ "$(jq -r .close "$RUNNER_TEMP/result.json")" = true ]; then gh issue close "$ISSUE_NUMBER"; fi

      # Runs even if Reply failed, but never after a failed Apply/Push: the local catalog
      # may then hold changes that never reached main. (Skipped steps don't count, so
      # kind=sync still runs.)
      - name: Sync review issues
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.load.outcome != 'failure' && steps.apply.outcome != 'failure' && steps.push.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURATORS: ${{ vars.CURATORS }}
        run: python -m ndif_citations review-sync

  notify:
    needs: apply
    if: ${{ always() && needs.apply.result != 'success' && inputs.kind != 'sync' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Tell the commenter
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 0
          # Neutral on purpose: the push may already have happened before the failure.
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ Something went wrong — check the issue's state before re-running: $RUN_URL"
