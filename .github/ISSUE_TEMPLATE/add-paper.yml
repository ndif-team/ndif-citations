name: Add a paper
description: Suggest a paper that uses or cites NDIF / NNsight
title: "Add paper: "
labels: [intake]
body:
  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: arXiv, DOI, ACL Anthology, or publisher link
      placeholder: https://arxiv.org/abs/2501.01234
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional — e.g. "uses NNsight for activation patching (Sec. 4)"
